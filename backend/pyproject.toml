[project]
name = "matchlens"
version = "0.1.0"
description = "Matchlens: explainable, personalised match intelligence from synthetic football events"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
