[project]
name = "matchlens"
version = "0.1.0"
description = "Matchlens: explainable, personalised match intelligence from synthetic football events"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.23.0",
    "agent-framework-foundry==1.15.0",
    "azure-identity==1.26.0",
    "fastapi==0.161.0",
    "mcp==1.30.0",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
